slf4j-jdk = { module = "org.slf4j:slf4j-jdk14", version.ref = "slf4j" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commons-codec" }
commons-lang = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
android-desugaring = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugaring" }
